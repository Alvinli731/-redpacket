<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>🧧 惡搞利是</title>

  <meta property="og:title" content="🧧 你收到一封惡搞利是">
  <meta property="og:description" content="撳入去睇下入面係咩 👀">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#b5121b">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #b5121b;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;
      color: white;
    }

    .card {
      width: min(88vw, 380px);
      padding: 44px 26px;
      border-radius: 26px;
      text-align: center;
      background: #d9272e;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }

    .emoji {
      font-size: 84px;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      opacity: .9;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 26px auto 0;
      border: 4px solid rgba(255,255,255,.32);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: white;
      font-size: 14px;
    }

    small {
      display: block;
      margin-top: 20px;
      opacity: .72;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="emoji">🧧</div>

    <h1>開緊利是...</h1>

    <p>準備跳轉 👀</p>

    <div class="loader"></div>

    <a href="https://www.instagram.com/p/DdpsnLJiZFB/">
      如果沒有自動跳轉，按這裡
    </a>

    <small>惡搞頁面</small>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace(
        "https://www.instagram.com/p/DdpsnLJiZFB/"
      );
    }, 1200);
  </script>

</body>
</html>
