<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>🧧 利是</title>

  <meta property="og:title"
        content="🧧 你收到一封利是">

  <meta property="og:description"
        content="撳入去開利是 👀">

  <meta property="og:type"
        content="website">

  <meta property="og:image"
        content="https://alvinli731.github.io/-redpacket/IMG_1155.jpeg">

  <meta name="theme-color"
        content="#b5121b">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #b5121b;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        Arial,
        sans-serif;

      overflow: hidden;
    }

    /* 開利是畫面 */
    #loadingScreen {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #b5121b;

      color: white;

      z-index: 10;
    }

    .card {
      width: 88%;
      max-width: 390px;

      padding: 45px 28px;

      text-align: center;

      background: #d9272e;

      border-radius: 28px;

      box-shadow:
        0 18px 55px rgba(0,0,0,.3);
    }

    .emoji {
      font-size: 88px;
      line-height: 1;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      opacity: .9;
    }

    .loader {
      width: 40px;
      height: 40px;

      margin: 28px auto 0;

      border: 4px solid rgba(255,255,255,.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 圖片畫面 */
    #photoScreen {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: black;

      z-index: 20;
    }

    #photoScreen img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: black;
    }
  </style>
</head>

<body>

  <div id="loadingScreen">

    <div class="card">

      <div class="emoji">
        🧧
      </div>

      <h1>
        開緊利是...
      </h1>

      <p>
        請稍候 👀
      </p>

      <div class="loader"></div>

    </div>

  </div>


  <div id="photoScreen">

    <img
      src="IMG_1155.jpeg"
      alt="圖片">

  </div>


  <script>

    /*
      預先載入圖片
    */

    const prankImage = new Image();

    prankImage.src = "IMG_1155.jpeg";


    /*
      約 1.2 秒後顯示圖片
    */

    setTimeout(function () {

      document
        .getElementById("loadingScreen")
        .style.display = "none";

      document
        .getElementById("photoScreen")
        .style.display = "flex";

    }, 1200);

  </script>

</body>
</html>
